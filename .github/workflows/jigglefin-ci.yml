name: Jigglefin CI

on:
  push:
    branches:
      - jigglefin
      - codex/live-filesystem
  pull_request:
    branches:
      - jigglefin
      - codex/live-filesystem
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jigglefin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore locked dependencies
        run: dotnet restore Jellyfin.sln --locked-mode

      - name: Build
        run: dotnet build Jellyfin.sln --configuration Release --no-restore -m:1

      - name: Prepare verified Jellyfin FFmpeg
        shell: pwsh
        run: .\scripts\prepare-ffmpeg.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'jellyfin-ffmpeg')

      - name: Test
        env:
          JIGGLEFIN_TEST_FFMPEG: ${{ runner.temp }}\jellyfin-ffmpeg\ffmpeg.exe
        run: dotnet test Jellyfin.sln --configuration Release --no-restore --no-build --verbosity minimal -m:1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Build offline Jigglefin folder UI
        shell: pwsh
        run: |
          Push-Location .\Jigglefin.Web
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Folder UI dependency install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Folder UI syntax check failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Folder UI build failed' }
          } finally {
            Pop-Location
          }

      - name: Package portable Windows server
        shell: pwsh
        run: |
          $ffmpegPath = Join-Path $env:RUNNER_TEMP 'jellyfin-ffmpeg'
          .\scripts\package-win.ps1 -FfmpegDirectory $ffmpegPath

      - name: Install headless folder UI test
        shell: pwsh
        run: |
          npm ci --prefix .\tests\WebClientSmoke --ignore-scripts --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'Headless Web test dependency install failed' }
          & .\tests\WebClientSmoke\node_modules\.bin\playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Headless Chromium install failed' }

      - name: Smoke-test packaged Windows server
        shell: pwsh
        run: .\scripts\smoke-live-package-win.ps1 -PackageDirectory .\publish\Jigglefin-win-x64

      - name: Check stock Android web-shell compatibility
        run: node --test tests/WebClientSmoke/android-shell.test.cjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Jigglefin-win-x64
          path: publish/Jigglefin-win-x64.zip
          if-no-files-found: error
          compression-level: 0
