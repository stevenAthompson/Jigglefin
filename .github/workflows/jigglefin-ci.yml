name: Jigglefin CI

on:
  push:
    branches:
      - jigglefin
  pull_request:
    branches:
      - jigglefin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jigglefin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore locked dependencies
        run: dotnet restore Jellyfin.sln --locked-mode

      - name: Build
        run: dotnet build Jellyfin.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.sln --configuration Release --no-restore --no-build --verbosity minimal
