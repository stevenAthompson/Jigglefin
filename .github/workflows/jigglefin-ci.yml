name: Jigglefin CI

on:
  push:
    branches:
      - jigglefin
  pull_request:
    branches:
      - jigglefin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jigglefin-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "10.0.x"
  WEB_COMMIT: 839563a2d633041d5854948d680bd393423b1abb

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Restore locked dependencies
        run: dotnet restore Jellyfin.sln --locked-mode

      - name: Build
        run: dotnet build Jellyfin.sln --configuration Release --no-restore

      - name: Prepare verified Jellyfin FFmpeg
        shell: pwsh
        run: .\scripts\prepare-ffmpeg.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'jellyfin-ffmpeg')

      - name: Test
        env:
          JIGGLEFIN_TEST_FFMPEG: ${{ runner.temp }}\jellyfin-ffmpeg\ffmpeg.exe
        run: dotnet test Jellyfin.sln --configuration Release --no-restore --no-build --verbosity minimal

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Build matching Jellyfin Web
        shell: pwsh
        run: |
          $webSource = Join-Path $env:RUNNER_TEMP 'jellyfin-web'
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/jellyfin/jellyfin-web.git $webSource
          if ($LASTEXITCODE -ne 0) { throw 'Jellyfin Web clone failed' }
          git -C $webSource fetch --depth 1 origin $env:WEB_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Jellyfin Web commit fetch failed' }
          git -C $webSource checkout --detach $env:WEB_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Jellyfin Web checkout failed' }
          Push-Location $webSource
          try {
            npm ci --no-audit
            if ($LASTEXITCODE -ne 0) { throw 'Jellyfin Web dependency install failed' }
            npm run build:production
            if ($LASTEXITCODE -ne 0) { throw 'Jellyfin Web build failed' }
          } finally {
            Pop-Location
          }

      - name: Package portable Windows server
        shell: pwsh
        run: |
          $ffmpegPath = Join-Path $env:RUNNER_TEMP 'jellyfin-ffmpeg'
          .\scripts\package-win.ps1 -WebDistPath (Join-Path $env:RUNNER_TEMP 'jellyfin-web/dist') -FfmpegDirectory $ffmpegPath

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Jigglefin-win-x64
          path: publish/Jigglefin-win-x64.zip
          if-no-files-found: error
          compression-level: 0
